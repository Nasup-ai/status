# Nasup's status page (QA-03, NFR-AVL-01, NFR-MNT-02): whether the customer app answers, from
# outside Cloudflare, every 5 minutes, with its incidents and planned maintenance.
# Public: it holds the app's public health URL and its up/down history only, no secrets and no
# customer data. Workflows run on this repository's own token: the template's self-update and setup
# workflows, which need a token that can rewrite workflows, were removed. Upptime's version is
# changed here by hand.
owner: Nasup-ai
repo: status

sites:
  - name: Nasup app
    url: https://app.nasup.ai/v1/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

# A short outage stays on record: incidents under 15 minutes are kept, not deleted.
skipDeleteIssues: true

status-website:
  cname: status.nasup.ai
  name: Nasup status
  introTitle: "Is Nasup up?"
  introMessage: Whether the Nasup app answers, checked every 5 minutes from outside our hosting, with any incident and planned maintenance. Planned maintenance is announced at least 3 days ahead and runs outside US business hours.
  navbar:
    - title: Status
      href: /
    - title: Nasup app
      href: https://app.nasup.ai
